<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=1200, initial-scale=0.33, maximum-scale=3.0, user-scalable=yes">
<style>
/* Absolute Desktop Mirror for Mobile */
body {
    width: 1200px !important;
    transform-origin: top left;
    transform: scale(0.35);
    overflow-x: auto !important;
    overflow-y: auto !important;
    background-color: #000 !important;
}
</style>
    <meta charset="UTF-8">
    <title>J.I.V.A. / R.I.A.N. Neural Interface</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #030712;
            color: #00ffff;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .hud-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            pointer-events: none; padding: 24px; display: grid;
            grid-template-columns: 280px 1fr 340px; grid-template-rows: 1fr auto; gap: 20px;
        }
        .interactive { pointer-events: auto; }
        .hud-card {
            background: rgba(3, 7, 18, 0.75); border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 8px; padding: 16px; box-shadow: 0 0 15px rgba(0, 255, 255, 0.15); backdrop-filter: blur(8px);
        }
        .hud-title { font-size: 14px; font-weight: bold; letter-spacing: 2px; color: #00ffff; margin-bottom: 12px; border-bottom: 1px dashed rgba(0, 255, 255, 0.3); padding-bottom: 4px; }
        .status-badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; margin-bottom: 6px; border: 1px solid #00ffaa; color: #00ffaa; }
        .purple-tag { border: 1px solid #d946ef; color: #d946ef; margin: 4px 0; padding: 4px 8px; font-size: 11px; border-radius: 4px; background: rgba(217, 70, 239, 0.05); }
        .dashboard-content { height: 180px; overflow-y: auto; font-size: 11px; line-height: 1.5; color: #67e8f9; }
        .control-bar { grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 12px; }
        .stream-status { font-size: 12px; letter-spacing: 2px; color: #00ffaa; }
        .input-box-container { display: flex; width: 100%; max-width: 650px; gap: 8px; }
        input[type="text"] {
            flex: 1; background: rgba(3, 7, 18, 0.85); border: 1px solid #00ffff; border-radius: 6px;
            padding: 12px 16px; color: #fff; font-family: inherit; font-size: 13px; outline: none;
        }
        button {
            background: rgba(0, 255, 255, 0.15); border: 1px solid #00ffff; color: #00ffff;
            padding: 0 24px; border-radius: 6px; font-family: inherit; font-weight: bold; cursor: pointer;
        }
        button:hover { background: #00ffff; color: #030712; }
        .mic-active { background: #ff0055 !important; color: #ffffff !important; border-color: #ff0055 !important; box-shadow: 0 0 15px #ff0055; }
    </style>

<style>
/* Auto-Responsive Universal Fix */
@media screen and (max-width: 768px) {
    body, html { overflow-x: hidden; width: 100%; }
    div, section, main { max-width: 100% !important; box-sizing: border-box; }
    .container, .dashboard, .panel { flex-direction: column !important; width: 100% !important; margin: 0 !important; padding: 8px !important; }
}
</style>

<style>
/* R.I.A.N. Mobile Precise Responsive Fix */
@media screen and (max-width: 768px) {
    body, html {
    }
    /* Stack panels and force full width */
    div, section, canvas, header, footer {
    }
    /* Target the 3D globe / canvas container */
    canvas {
    }
    /* Make logs and system panels stack vertically */
    .panel, .log-box, pre, code {
    }
}
</style>


<style>
/* Force mobile to render the exact desktop 3D layout */
@media screen and (max-width: 1024px) {
    body {
        transform-origin: top left;
        transform: scale(0.38);
    }
}
</style>
</head>



<body>
    <div id="canvas-container"></div>
    <div class="hud-layer">
        <div class="hud-card interactive">
            <div class="hud-title">SYSTEM R.I.A.N.</div>
            <div class="status-badge">STATUS: ONLINE</div>
            <div style="font-size: 11px; margin-bottom: 6px; color:#67e8f9;">NEURAL LINK: ESTABLISHED</div>
            <div style="font-size: 11px; margin-bottom: 12px; color:#67e8f9;">VOICE: ACTIVE</div>
            <div class="purple-tag">[CONTEXT] Gaura_Purey_Badal</div>
            <div class="purple-tag">[CONTEXT] Active_Session</div>
        </div>
        <div></div>
        <div class="hud-card interactive">
            <div class="hud-title">Execution Dashboard</div>
            <div class="dashboard-content" id="dashboard">
                <div>[SYSTEM] 3D Neural Holo-Core Active.</div>
                <div>[SYSTEM] Telemetry WebSocket Synced.</div>
            </div>
            <div style="margin-top: 10px;">
                <div class="purple-tag">[MEMORY] User_Prefs</div>
                <div class="purple-tag">[FILES] project_R.I.A.N_V2.0</div>
            </div>
        </div>
        <div class="control-bar interactive">
            <div class="stream-status" id="streamStatus">SYSTEM READY - TAP MIC OR SPEAK</div>
            <div class="input-box-container">
                <button id="micToggleBtn" style="padding: 0 18px;">🎙️ REC</button>
                <input type="text" id="userInput" placeholder="Type command or click REC..." autocomplete="off">
                <button id="sendBtn">Send</button>
            </div>
        </div>
    </div>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 25;
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const sphereGeo = new THREE.BufferGeometry();
        const count = 4000;
        const positions = new Float32Array(count * 3);
        for(let i = 0; i < count * 3; i += 3) {
            let u = Math.random(), v = Math.random();
            let theta = u * 2.0 * Math.PI, phi = Math.acos(2.0 * v - 1.0);
            let r = 8.5 + (Math.random() - 0.5) * 0.8;
            positions[i] = r * Math.sin(phi) * Math.cos(theta);
            positions[i+1] = r * Math.sin(phi) * Math.sin(theta);
            positions[i+2] = r * Math.cos(phi);
        }
        sphereGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const sphereMesh = new THREE.Points(sphereGeo, new THREE.PointsMaterial({ size: 0.08, color: 0x00ffff }));
        scene.add(sphereMesh);

        const ringGeo = new THREE.TorusGeometry(12, 0.05, 16, 100);
        const ringMesh = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.5 }));
        ringMesh.rotation.x = Math.PI / 2.3;
        scene.add(ringMesh);

        function animate() {
            requestAnimationFrame(animate);
            sphereMesh.rotation.y += 0.003;
            sphereMesh.rotation.x += 0.001;
            ringMesh.rotation.z += 0.002;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const dashboard = document.getElementById('dashboard');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const streamStatus = document.getElementById('streamStatus');
        const micToggleBtn = document.getElementById('micToggleBtn');
        
        const loc = window.location;
        const wsProtocol = loc.protocol === 'https:' ? 'wss://' : 'ws://';
        const ws = new WebSocket(wsProtocol + loc.host + '/ws/telemetry');

        function logToDashboard(sender, msg) {
            let div = document.createElement('div');
            div.style.marginTop = '4px';
            div.style.color = sender === 'USER' ? '#00ffff' : '#00ffaa';
            div.innerText = '[' + sender + '] ' + msg;
            dashboard.appendChild(div);
            dashboard.scrollTop = dashboard.scrollHeight;
        }

        ws.onmessage = function(event) {
            try {
                let data = JSON.parse(event.data);
                let text = data.text || data.response || data.message || data.output || '';
                if (text) {
                    let clean = text.replace(/^.*\[RIAN\]\s*/i, '');
                    logToDashboard('RIAN', clean);
                }
            } catch(e) {
                if (typeof event.data === 'string') {
                    let clean = event.data.replace(/^.*\[RIAN\]\s*/i, '');
                    logToDashboard('RIAN', clean);
                }
            }
        };

        // Unique Request Token Generator to prevent server echo
        function generateRequestId() {
            return "req_" + Date.now() + "_" + Math.random().toString(36).substr(2, 6);
        }

        function sendCommand() {
            let txt = userInput.value.trim();
            if (!txt) return;
            logToDashboard('USER', txt);
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ 
                    text: txt,
                    query: txt,
                    request_id: generateRequestId()
                }));
            }
            userInput.value = '';
        }

        sendBtn.addEventListener('click', sendCommand);
        userInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendCommand(); });

        // ==========================================
        // HARDWARE-LOCKED DISPATCHER (NO DUPLICATE LOOP)
        // ==========================================
        let mediaStream = null;
        let recorder = null;
        let voiceChunks = [];
        let isRecording = false;
        let isSystemProcessing = false;
        let lastVoiceDispatchTime = 0;

        async function initAudioDevice() {
            if (!mediaStream) {
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            }
        }

        async function toggleRecord() {
            if (isSystemProcessing) return;

            if (!isRecording) {
                await initAudioDevice();
                voiceChunks = [];
                
                // Audio mimeType fallback for cross-device support (iOS / Android / Chrome)
                let options = { mimeType: 'audio/webm' };
                if (!MediaRecorder.isTypeSupported('audio/webm')) {
                    if (MediaRecorder.isTypeSupported('audio/mp4')) {
                        options = { mimeType: 'audio/mp4' };
                    } else {
                        options = {};
                    }
                }
                
                recorder = new MediaRecorder(mediaStream, options);

                recorder.ondataavailable = (e) => {
                    if (e.data && e.data.size > 0) voiceChunks.push(e.data);
                };

                recorder.onstop = async () => {
                    if (voiceChunks.length === 0) {
                        isSystemProcessing = false;
                        resetMicUI();
                        return;
                    }

                    // Loop Shield: Ignore dispatches faster than 1.5 seconds
                    const now = Date.now();
                    if (now - lastVoiceDispatchTime < 1500) {
                        voiceChunks = [];
                        isSystemProcessing = false;
                        resetMicUI();
                        return;
                    }
                    lastVoiceDispatchTime = now;

                    isSystemProcessing = true;
                    streamStatus.innerText = "⚡ PROCESSING NEURAL INSTRUCTION...";
                    
                    const mimeType = recorder.mimeType || 'audio/webm';
                    const audioBlob = new Blob(voiceChunks, { type: mimeType });
                    voiceChunks = [];
                    const formData = new FormData();
                    formData.append('file', audioBlob);
                    formData.append('request_id', generateRequestId());

                    try {
                        const res = await fetch('/api/voice-query', { method: 'POST', body: formData });
                        const data = await res.json();

                        if (data.user_text && data.user_text.trim().length > 1) {
                            logToDashboard('USER', data.user_text);
                        }
                        if (data.response_text) {
                            logToDashboard('RIAN', data.response_text);
                        }
                        if (data.audio_b64) {
                            streamStatus.innerText = "🔊 R.I.A.N. SPEAKING...";
                            const audio = new Audio("data:audio/mp3;base64," + data.audio_b64);
                            audio.onended = () => {
                                isSystemProcessing = false;
                                resetMicUI();
                            };
                            audio.onerror = () => {
                                isSystemProcessing = false;
                                resetMicUI();
                            };
                            await audio.play();
                        } else {
                            isSystemProcessing = false;
                            resetMicUI();
                        }
                    } catch (err) {
                        console.error("Voice Error:", err);
                        isSystemProcessing = false;
                        resetMicUI();
                    }
                };

                recorder.start();
                isRecording = true;
                micToggleBtn.classList.add('mic-active');
                micToggleBtn.innerText = "🛑 STOP";
                streamStatus.innerText = "🔴 LISTENING... SPEAK NOW";
            } else {
                isRecording = false;
                if (recorder && recorder.state !== 'inactive') {
                    recorder.stop();
                }
            }
        }

        function resetMicUI() {
            micToggleBtn.classList.remove('mic-active');
            micToggleBtn.innerText = "🎙️ REC";
            streamStatus.innerText = "SYSTEM READY - TAP MIC OR SPEAK";
        }

        micToggleBtn.addEventListener('click', toggleRecord);

        // Auto greeting on initial load
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('/api/system-greeting');
                const data = await res.json();
                if (data.audio_b64) {
                    const greetingAudio = new Audio("data:audio/mp3;base64," + data.audio_b64);
                    await greetingAudio.play().catch(() => {
                        document.body.addEventListener('click', () => {
                            greetingAudio.play();
                        }, { once: true });
                    });
                }
            } catch (e) {}
        });
    </script>
</body>
</html>
